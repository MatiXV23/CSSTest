# Publica el sitio en GitHub Pages cada vez que se sube código a main.
# Requiere: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si hay una en curso, se deja terminar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # El sitio es estático y no tiene paso de build: se publica la carpeta tal cual.
      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
